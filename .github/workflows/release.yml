name: Release
# Push a tag like v1.1.0 to publish the pgbhub crate. Needs the CARGO_REGISTRY_TOKEN repository secret.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag must match Cargo.toml
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "${GITHUB_REF_NAME}"
      - run: cargo test
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
