[package]
name = "pgbox"
version = "1.0.0"
edition = "2021"
authors = ["Hydratik <engineering@pgbhub.com>"]
description = "Official Rust client SDK for PGBox Cloud"
license = "MIT"
repository = "https://github.com/PGBHub/pgbox-sdk-rs"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
