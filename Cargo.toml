[package]
name = "pgbhub"
version = "1.2.0"
edition = "2021"
authors = ["Hydratik <engineering@pgbhub.com>"]
description = "Official Rust client SDK for PGB Hub"
license = "MIT"
repository = "https://github.com/PGBHub/pgb-sdk-rs"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

[dev-dependencies]
wiremock = "0.6"
